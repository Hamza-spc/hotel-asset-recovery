spring:
  application:
    name: lostfound
  datasource:
    url: jdbc:postgresql://localhost:5433/lostfound
    username: lostfound
    password: lostfound
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9094
  modulith:
    events:
      externalization:
        enabled: true
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.security.issuer-uri}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      endpoint: http://localhost:4318/v1/traces
      export:
        enabled: true

app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost
  security:
    issuer-uri: http://localhost:8081/realms/hotel
  storage:
    endpoint: http://localhost:9000
    access-key: lostfound
    secret-key: lostfoundsecret
    bucket: lostfound-photos
    region: us-east-1

