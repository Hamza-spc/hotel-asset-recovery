spring:
  application:
    name: lostfound
  datasource:
    url: jdbc:postgresql://localhost:5433/lostfound
    username: lostfound
    password: lostfound
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9094
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.security.issuer-uri}
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    tracing:
      export:
        enabled: false

app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost
  security:
    issuer-uri: http://localhost:8081/realms/hotel
